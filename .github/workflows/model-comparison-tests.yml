name: Model comparison and champion policy tests

on:
  pull_request:
    paths:
      - 'workers/analytics/**'
      - 'workers/models/**'
      - 'workers/.dockerignore'
      - 'src/Domain/ModelComparison/**'
      - 'src/Domain/ModelHealth/**'
      - 'src/Domain/MarketCatalog.php'
      - 'src/Contracts/Champion*.php'
      - 'src/Repositories/UnavailableChampionRepository.php'
      - 'src/Services/ChampionDecisionService.php'
      - 'tests/ModelComparisonTest.php'
      - 'tests/Support/ChampionTestRepository.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'phpcs-model-comparison.xml'
      - '.github/workflows/model-comparison-tests.yml'
  push:
    paths:
      - 'workers/analytics/**'
      - 'workers/models/**'
      - 'workers/.dockerignore'
      - 'src/Domain/ModelComparison/**'
      - 'src/Domain/ModelHealth/**'
      - 'src/Domain/MarketCatalog.php'
      - 'src/Contracts/Champion*.php'
      - 'src/Repositories/UnavailableChampionRepository.php'
      - 'src/Services/ChampionDecisionService.php'
      - 'tests/ModelComparisonTest.php'
      - 'tests/Support/ChampionTestRepository.php'
      - 'composer.*'
      - 'phpunit.xml.dist'
      - 'phpcs-model-comparison.xml'
      - '.github/workflows/model-comparison-tests.yml'

permissions:
  contents: read

jobs:
  php-policies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint:model-comparison
      - run: composer test:model-comparison
      - run: composer test:model-health
      - run: php tests/catalog.php
  numerical:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONPATH: workers/models:workers/analytics
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: workers/models/requirements.txt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer install --no-dev --no-interaction --prefer-dist
      - run: python -m pip install --no-compile -r workers/models/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s workers/analytics/tests -v
